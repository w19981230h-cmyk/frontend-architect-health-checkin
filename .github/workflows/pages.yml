name: Publish complete patient management system
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Verify dashboard data
        run: |
          node scripts/verify-dashboard-latest.cjs
          node scripts/verify-dashboard-scope.cjs
      - name: Package all system pages
        run: |
          mkdir _site
          cp *.html *.js *.css _site/
          cp -R assets css js data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
